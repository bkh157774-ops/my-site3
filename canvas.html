<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Полотно — Lumae</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#0a0a0d; --viewport-bg:#0a0a0c; --dot:#1c1c22; --ink:#f3f3f6; --ink-soft:#8d8d97;
    --accent:#8f7bff; --accent2:#3ddc84; --accent-soft:rgba(143,123,255,0.16); --line:#232329;
    --glass-bg:rgba(19,19,23,0.82); --glass-border:rgba(255,255,255,0.08); --radius:16px;
    --shadow:0 14px 44px rgba(0,0,0,0.6); --card-bg:#141317; --danger:#ff5c5c; --area-tint:rgba(143,123,255,0.07);
    --glow:0 0 0 1px rgba(143,123,255,0.25), 0 0 26px rgba(143,123,255,0.14);
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --viewport-bg:#fafafa; --dot:#dfdfe4; --ink:#1d1d1f; --ink-soft:#79797f;
    --accent:#5b5fef; --accent2:#13ab5a; --accent-soft:#eef0ff; --line:#e2e2e6; --glass-bg:rgba(255,255,255,0.88);
    --glass-border:rgba(0,0,0,0.07); --shadow:0 10px 34px rgba(20,20,30,0.10);
    --card-bg:#ffffff; --danger:#ff453a; --area-tint:rgba(91,95,239,0.05); --glow:0 0 0 1px rgba(91,95,239,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;}
  #app{position:fixed;inset:0;}
  #viewport{position:absolute;inset:0;overflow:hidden;background:var(--viewport-bg);
    background-image:radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size:26px 26px;background-position:0 0;cursor:grab;touch-action:none;}
  #viewport::before{content:'';position:absolute;inset:-10%;pointer-events:none;z-index:0;
    background:radial-gradient(640px 420px at 18% 12%, rgba(143,123,255,0.12), transparent 62%),
      radial-gradient(560px 380px at 86% 82%, rgba(61,220,132,0.09), transparent 62%),
      radial-gradient(420px 320px at 70% 10%, rgba(255,110,199,0.07), transparent 65%);}
  #viewport.panning{cursor:grabbing;} #viewport.drawing,#viewport.area-mode{cursor:crosshair;}
  #world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;}
  svg#links,svg#drawlayer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  @keyframes linkFlow{to{stroke-dashoffset:-24;}}
  .link-path{fill:none;stroke:var(--accent);stroke-width:2;opacity:.8;stroke-dasharray:5 7;}
  @media (min-width:900px){ .link-path{animation:linkFlow 1.4s linear infinite;filter:drop-shadow(0 0 4px rgba(143,123,255,0.45));} }
  .link-arrow{fill:var(--accent);opacity:.9;}
  .draw-path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}

  .area{position:absolute;border:1.5px dashed var(--accent);border-radius:18px;background:var(--area-tint);z-index:1;touch-action:none;}
  .area .a-label{position:absolute;top:-26px;left:6px;font-size:12px;color:var(--accent);background:var(--glass-bg);padding:2px 9px;border-radius:8px;border:1px solid var(--glass-border);outline:none;}
  .area-preview{position:absolute;border:1.5px dashed var(--accent);border-radius:14px;background:var(--area-tint);pointer-events:none;z-index:1;}

  @keyframes blockIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes portPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
  @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

  .block{position:absolute;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line);min-width:140px;min-height:64px;z-index:2;touch-action:none;
    transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;animation:blockIn .22s ease;}
  .block:hover{box-shadow:var(--shadow),var(--glow);border-color:rgba(143,123,255,0.35);}
  .block.selected{outline:2px solid var(--accent);outline-offset:2px;box-shadow:var(--shadow),var(--glow);}
  .block.linking-source{outline:2px solid #ffb020;outline-offset:2px;}
  .port-dot{position:absolute;top:12px;left:36px;width:7px;height:7px;border-radius:50%;z-index:6;
    box-shadow:0 0 7px currentColor;pointer-events:none;opacity:.85;}
  @media (min-width:900px){ .port-dot{animation:portPulse 2.6s ease-in-out infinite;} }
  .block-handle{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;cursor:grab;opacity:.7;transition:opacity .12s,background .12s;z-index:6;}
  .block:hover .block-handle,.block-handle:active{opacity:1;background:var(--accent-soft);}
  .block-handle svg{width:15px;height:15px;stroke:var(--ink-soft);pointer-events:none;}
  .block-close{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;
    background:var(--line);color:var(--ink-soft);opacity:.75;cursor:pointer;font-size:12px;line-height:26px;text-align:center;padding:0;z-index:6;transition:transform .12s,background .12s;}
  .block-close:hover,.block-close:active{background:var(--danger);color:#fff;opacity:1;transform:scale(1.08);}
  .resize-handle{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;z-index:6;opacity:.6;padding:6px;box-sizing:border-box;}
  .block:hover .resize-handle,.resize-handle:active{opacity:1;}
  .resize-handle svg{width:100%;height:100%;stroke:var(--ink-soft);}
  .comment-badge{position:absolute;bottom:6px;right:6px;background:var(--accent);color:#fff;font-size:10px;border-radius:9px;
    padding:3px 7px 3px 5px;z-index:5;cursor:pointer;display:flex;align-items:center;gap:3px;}
  .comment-badge svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2;}

  .block-body{padding:14px 40px 12px 36px;height:100%;position:relative;z-index:1;}
  .block.text .block-body{outline:none;font-size:var(--fs,14.5px);line-height:1.5;min-height:44px;overflow:auto;height:100%;}
  .block.text .block-body:empty:before{content:attr(data-ph);color:var(--ink-soft);}
  .block.card .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px;cursor:pointer;user-select:none;}
  .block.card .tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .block.card .card-title{font-weight:600;font-size:14px;outline:none;margin-bottom:3px;}
  .block.card .card-desc{font-size:12.5px;color:var(--ink-soft);outline:none;line-height:1.4;margin-bottom:6px;}
  .block.card .card-row{display:flex;gap:8px;align-items:flex-start;}
  .block.card input[type=checkbox]{margin-top:3px;accent-color:var(--accent);flex:none;}
  .block.card input[type=date]{border:none;background:var(--accent-soft);color:var(--ink-soft);font-size:11px;border-radius:6px;padding:2px 6px;font-family:inherit;}

  .block.image .img-body,.block.video .img-body{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;position:relative;z-index:1;overflow:hidden;border-radius:var(--radius);}
  .block.image img,.block.video video{width:100%;height:100%;object-fit:cover;display:block;}
  .img-placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-soft);font-size:12px;cursor:pointer;padding:20px 40px 20px 36px;width:100%;height:100%;justify-content:center;text-align:center;}
  .img-placeholder svg{width:26px;height:26px;stroke:var(--ink-soft);}
  .block.file .file-body{display:flex;align-items:center;gap:10px;height:100%;padding:14px 40px 14px 36px;}
  .block.file .file-body svg{width:26px;height:26px;stroke:var(--accent);flex:none;}
  .block.file .file-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .block.file .file-size{font-size:11px;color:var(--ink-soft);}

  #topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
    background:var(--glass-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;
    padding:7px 8px 7px 14px;box-shadow:var(--shadow);z-index:30;max-width:92vw;}
  #topbar .title{font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px;}
  #topbar .logo-mark{width:20px;height:20px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  #topbar .logo-mark svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:1.9;}
  .mode-dd{position:relative;} .mode-btn{border:none;background:var(--accent-soft);color:var(--accent);font-size:12.5px;
    font-weight:500;padding:6px 9px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .mode-btn svg{width:10px;height:10px;stroke:var(--accent);}
  .mode-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:170px;background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60;}
  .mode-menu.open{display:block;animation:popIn .14s ease;}
  .mode-item{padding:8px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .mode-item:hover{background:var(--accent-soft);color:var(--accent);}
  .mode-item.active{background:var(--accent);color:#fff;}
  #smart-btn{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--ink-soft);
    font-size:12.5px;cursor:pointer;padding:6px 9px;border-radius:9px;white-space:nowrap;}
  #smart-btn:hover,#smart-btn.active{background:var(--accent-soft);color:var(--accent);}
  #smart-btn svg{width:14px;height:14px;flex:none;}

  #toolbar{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;
    background:var(--glass-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;
    padding:8px;box-shadow:var(--shadow);z-index:30;}
  .tool{width:38px;height:38px;border-radius:10px;border:none;background:transparent;display:flex;align-items:center;
    justify-content:center;cursor:pointer;color:var(--ink);position:relative;transition:background .14s,transform .1s;}
  .tool svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;pointer-events:none;}
  .tool:hover{background:var(--accent-soft);}
  .tool:active{transform:scale(.9);}
  .tool.active{background:var(--accent);box-shadow:0 0 14px rgba(143,123,255,0.55);} .tool.active svg{stroke:#fff;}
  .tool-sep{height:1px;background:var(--line);margin:4px 6px;}
  .more-menu{position:absolute;left:calc(100% + 8px);top:0;min-width:150px;background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60;}
  .more-menu.open{display:block;animation:popIn .14s ease;}
  .more-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .more-item:hover{background:var(--accent-soft);color:var(--accent);}
  .more-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;}

  #zoomctl{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;
    background:var(--glass-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:12px;
    padding:4px;box-shadow:var(--shadow);z-index:30;font-size:12px;color:var(--ink-soft);}
  #zoomctl button{width:28px;height:28px;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--ink);font-size:15px;}
  #zoomctl button:disabled{opacity:.3;cursor:default;}
  #zoomctl button:not(:disabled):hover{background:var(--accent-soft);}
  #zoomctl span{padding:0 4px;min-width:40px;text-align:center;}
  #zoomctl .sep{width:1px;height:18px;background:var(--line);margin:0 4px;}

  #smart-panel{position:absolute;top:66px;right:14px;width:270px;background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:16px;box-shadow:var(--shadow);padding:14px;z-index:40;
    font-size:12.5px;display:none;}
  #smart-panel.open{display:block;animation:popIn .16s ease;}
  #smart-panel h4{margin:0 0 10px;font-size:13px;}
  #smart-panel .close-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;}
  .smart-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .smart-actions button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--card-bg);border-radius:12px;padding:11px 4px 9px;font-size:11px;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2;transition:border-color .14s,background .14s,transform .1s;}
  .smart-actions button:active{transform:scale(.96);}
  .smart-actions button:hover{border-color:var(--accent);background:var(--accent-soft);}
  .smart-actions button:hover .ic{background:var(--accent);}
  .smart-actions button:hover .ic svg{stroke:#fff;color:#fff;}
  .smart-actions button .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;
    align-items:center;justify-content:center;transition:background .12s;}
  .smart-actions button .ic svg{width:17px;height:17px;stroke:var(--accent);color:var(--accent);fill:none;stroke-width:1.7;transition:stroke .12s;}
  .smart-result{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink);line-height:1.5;white-space:pre-line;min-height:18px;}

  #style-bar{position:absolute;display:none;align-items:center;gap:6px;background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow);z-index:45;}
  #style-bar.open{display:flex;animation:popIn .14s ease;}
  .swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:1.5px solid var(--glass-border);}
  #style-bar .fsz{display:flex;gap:2px;} #style-bar .fsz button{width:22px;height:22px;border:none;background:var(--accent-soft);
    color:var(--accent);border-radius:6px;cursor:pointer;font-size:12px;}
  #style-bar .cmt{width:24px;height:24px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #style-bar .cmt svg{width:15px;height:15px;stroke:currentColor;fill:none;}

  #comment-pop{position:absolute;display:none;width:210px;background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow);padding:10px;z-index:46;font-size:12px;}
  #comment-pop.open{display:block;animation:popIn .14s ease;}
  #comment-pop .c-item{padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink);}
  #comment-pop input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px;
    background:var(--bg);color:var(--ink);outline:none;}

  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:12px;padding:7px 14px;font-size:11.5px;color:var(--ink-soft);
    box-shadow:var(--shadow);z-index:30;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center;}

  body.presenting #toolbar,body.presenting .mode-dd,body.presenting #zoomctl,body.presenting #hint,body.presenting #style-bar{display:none!important;}
  #present-bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:none;align-items:center;gap:14px;
    background:var(--glass-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;
    padding:8px 14px;box-shadow:var(--shadow);z-index:35;}
  body.presenting #present-bar{display:flex;}
  #present-bar button{border:none;background:var(--accent);color:#fff;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;}
  #present-bar span{font-size:12.5px;color:var(--ink-soft);} #present-bar .exit{background:var(--line);color:var(--ink);}

  .block.pinned{outline:1.5px dashed var(--ink-soft);}
  .pin-badge{position:absolute;top:4px;left:36px;width:20px;height:20px;border-radius:6px;background:var(--glass-bg);
    border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none;}
  .pin-badge svg{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:1.8;}
  .block.dimmed{opacity:.22;filter:saturate(.35);transition:opacity .2s;}
  .block.search-hit{outline:2px solid #ffb020!important;outline-offset:2px;}
  #style-bar .pin,#style-bar .focus{width:24px;height:24px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;}
  #style-bar .pin.active,#style-bar .focus.active{color:var(--accent);background:var(--accent-soft);}
  #style-bar .pin svg,#style-bar .focus svg{width:15px;height:15px;stroke:currentColor;fill:none;}

  #search-btn{border:none;background:transparent;color:var(--ink-soft);width:30px;height:30px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #search-btn:hover,#search-btn.active{background:var(--accent-soft);color:var(--accent);}
  #search-btn svg{width:14px;height:14px;}
  #search-input{display:none;border:none;background:var(--accent-soft);color:var(--ink);font-size:12.5px;padding:6px 9px;
    border-radius:9px;outline:none;width:120px;font-family:inherit;}
  #search-input.open{display:block;}

  #minimap{position:absolute;left:14px;bottom:14px;width:130px;height:90px;background:var(--glass-bg);backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow);z-index:30;overflow:hidden;cursor:pointer;}
  #minimap .mm-dot{position:absolute;width:7px;height:7px;border-radius:2px;margin:-3.5px;box-shadow:0 0 0 1px rgba(255,255,255,.6);}
  #minimap .mm-view{position:absolute;border:1.5px solid var(--accent);background:rgba(91,95,239,0.10);pointer-events:none;border-radius:2px;}

  .a-eye{position:absolute;top:-26px;right:6px;width:20px;height:20px;background:var(--glass-bg);border:1px solid var(--glass-border);
    border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);z-index:2;}
  .a-eye svg{width:12px;height:12px;stroke:currentColor;fill:none;}

  .link-label{font-size:10px;fill:var(--ink-soft);}
  .link-label-bg{fill:var(--glass-bg);opacity:.9;}

  body.presenting #minimap,body.presenting #search-btn,body.presenting #search-input{display:none!important;}
  @media (max-width:560px){
    #topbar .title{display:none;} #topbar{padding:6px 6px 6px 10px;gap:6px;} #smart-btn span.lbl{display:none;}
    #minimap{width:96px;height:70px;} #hint{display:none;}
    #topbar,#toolbar,#zoomctl,#smart-panel,#style-bar,#comment-pop,#minimap,.mode-menu,.more-menu,#present-bar{
      backdrop-filter:none; background:var(--card-bg);
    }
    #viewport::before{display:none;}
    .block{transition:none;animation:none;}
  }
  ::selection{background:var(--accent-soft);}
  .shared-dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:8px;}
  .shared-dock-pill{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(28,28,31,.96);box-shadow:0 16px 38px rgba(0,0,0,.28);backdrop-filter:blur(18px);}
  .shared-dock button{display:grid;place-items:center;width:46px;height:46px;flex:none;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;}
  .shared-dock button.active{background:#fff;color:#111113;}
  .shared-dock button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .shared-dock .dock-home{background:#0a84ff;color:#fff;}
  .shared-dock-profile{width:50px!important;height:50px!important;border-radius:50%!important;background:linear-gradient(135deg,#f3f4f6,#dbeafe)!important;color:#111113!important;font-size:17px;font-weight:800;box-shadow:0 12px 26px rgba(0,0,0,.2);}
  .shared-dock-profile img,.shared-dock-profile video{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit;}
  @media(max-width:380px){.shared-dock{gap:5px}.shared-dock-pill{gap:3px;padding:5px}.shared-dock button{width:38px;height:38px}.shared-dock button svg{width:19px;height:19px}.shared-dock-profile{width:42px!important;height:42px!important}}
  @media(min-width:761px){.shared-dock{display:none}}
  @media(max-width:760px){#zoomctl{bottom:84px;right:10px}#minimap{bottom:84px}}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="world">
      <svg id="links"></svg>

<script>
(function(){
  const viewport=document.getElementById('viewport'), world=document.getElementById('world');
  const linksSvg=document.getElementById('links'), drawSvg=document.getElementById('drawlayer');
  let pan={x:-1500+innerWidth/2,y:-1500+innerHeight/2}, zoom=1;
  let idSeq=1;
  let state={blocks:[],areas:[],links:[],drawings:[]};
  let selected=new Set();
  let linkMode=false, linkSource=null, drawMode=false, areaMode=false;
  let snapEnabled=true, focusMode=false;
  let undoStack=[], redoStack=[];
  let act=null; // active pointer action

  function serializeState(){ return JSON.stringify(state, (k,v)=> k==='el' ? undefined : v); }
  function snapshot(){ redoStack=[]; undoStack.push(serializeState()); if(undoStack.length>60) undoStack.shift(); updateHist(); }
  function updateHist(){ document.getElementById('undoBtn').disabled=!undoStack.length; document.getElementById('redoBtn').disabled=!redoStack.length; }
  function undo(){ if(!undoStack.length) return; redoStack.push(serializeState()); state=JSON.parse(undoStack.pop()); selected.clear(); render(); updateHist(); }
  function redo(){ if(!redoStack.length) return; undoStack.push(serializeState()); state=JSON.parse(redoStack.pop()); selected.clear(); render(); updateHist(); }
  snapshot(); // base empty state

  function applyTransform(){
    world.style.transform=`translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
    document.getElementById('zoomVal').textContent=Math.round(zoom*100)+'%';
    const sp=26*zoom; viewport.style.backgroundSize=sp+'px '+sp+'px'; viewport.style.backgroundPosition=pan.x+'px '+pan.y+'px';
    updateStyleBarPos();
    if(typeof scheduleMinimap==='function') scheduleMinimap();
  }
  function toWorld(cx,cy){ const r=viewport.getBoundingClientRect(); return {x:(cx-r.left-pan.x)/zoom, y:(cy-r.top-pan.y)/zoom}; }
  function screenCenterToWorld(){ const r=viewport.getBoundingClientRect(); return {x:(r.width/2-pan.x)/zoom, y:(r.height/2-pan.y)/zoom}; }
  function snap(v){ return snapEnabled ? Math.round(v/10)*10 : v; }

  const defaultHint='Тяните пустое место — панорама · колесо — масштаб · тяните блок за корпус';
  function flashHint(msg,persist){
    const h=document.getElementById('hint'); h.textContent=msg;
    if(!persist){ clearTimeout(h._t); h._t=setTimeout(()=>{ h.textContent=drawMode?'Рисуйте — линия останется на полотне':areaMode?'Потяните на пустом месте, чтобы создать область':linkMode?'Кликните по двум блокам, чтобы соединить их':defaultHint; },2200); }
  }

  // ---------------- RENDER ----------------
  function render(){
    world.querySelectorAll('.area,.block').forEach(n=>n.remove());
    state.areas.forEach(buildAreaEl);
    state.blocks.forEach(buildBlockEl);
    rebuildDrawings();
    drawLinks();
    updateStyleBarPos();
  }

  function buildAreaEl(a){
    const el=document.createElement('div'); el.className='area';
    el.style.left=a.x+'px'; el.style.top=a.y+'px'; el.style.width=a.w+'px'; el.style.height=a.h+'px';
    el.innerHTML=`<div class="a-label" contenteditable="true">${a.label}</div>
      <button class="a-eye" title="Скрыть/показать содержимое"><svg viewBox="0 0 24 24" stroke-width="1.8">${a.hidden?'<path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A9.5 9.5 0 0 1 12 5c5 0 9 4 10 7-.5 1.3-1.3 2.6-2.4 3.7M6.4 6.4C4.3 7.8 2.8 9.8 2 12c1 3 5 7 10 7 1.1 0 2.1-.2 3-.5"/>':'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'}</svg></button>`;
    world.appendChild(el); a.el=el;
    if(a.hidden) el.classList.add('hidden');
    el.querySelector('.a-label').addEventListener('input', e=>{ a.label=e.target.textContent; });
    el.querySelector('.a-label').addEventListener('blur', snapshot);
    el.querySelector('.a-eye').addEventListener('pointerdown', e=>e.stopPropagation());
    el.querySelector('.a-eye').addEventListener('click', (e)=>{
      e.stopPropagation(); a.hidden=!a.hidden; render(); snapshot();
    });
    el.addEventListener('pointerdown',(e)=>{
      if(e.target.isContentEditable||e.target.closest('.a-eye')) return;
      e.stopPropagation();
      const members=state.blocks.filter(b=>b.areaId===a.id).map(b=>({b,sx:b.x,sy:b.y}));
      act={type:'area-move', a, members, mx:e.clientX, my:e.clientY};
    });
  }

  function groupSelectedIntoArea(){
    const members=[...selected]; if(members.length<2) return;
    const pad=26;
    const x=Math.min(...members.map(m=>m.x))-pad, y=Math.min(...members.map(m=>m.y))-pad;
    const w=Math.max(...members.map(m=>m.x+m.w))-x+pad, h=Math.max(...members.map(m=>m.y+m.h))-y+pad;
    const a={id:'a'+(idSeq++), x, y, w, h, label:'Группа'};
    state.areas.push(a); buildAreaEl(a); world.insertBefore(a.el, world.children[2]||null);
    members.forEach(b=> b.areaId=a.id);
    clearSelection(); snapshot(); flashHint('Область создана (Ctrl+G)');
  }

  function memberOf(area,b){ return b.x+b.w/2>area.x && b.x+b.w/2<area.x+area.w && b.y+b.h/2>area.y && b.y+b.h/2<area.y+area.h; }
  function updateAreaFrame(a){ a.el.style.left=a.x+'px'; a.el.style.top=a.y+'px'; a.el.style.width=a.w+'px'; a.el.style.height=a.h+'px'; }

  function isInteractiveTarget(t){ return !!(t.isContentEditable || t.closest('input,button,.img-placeholder,.card-desc,.card-title,.a-label')); }

  function buildBlockEl(b){
    const el=document.createElement('div'); el.className='block '+b.type+(b.pinned?' pinned':'');
    el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px'; el.style.height=b.h+'px';
    const ownerArea=b.areaId&&state.areas.find(a=>a.id===b.areaId);
    if(ownerArea&&ownerArea.hidden) el.style.display='none';
    if(b.style && b.style.bg) el.style.background=b.style.bg;
    let body='';
    if(b.type==='text'){
      body=`<div class="block-body" contenteditable="true" data-ph="Заметка или идея…" style="--fs:${(b.style&&b.style.fs)||14.5}px">${b.content.text||''}</div>`;
    } else if(b.type==='card'){
      body=`<div class="block-body">
        <span class="tag"><span class="dot"></span><span class="status">${b.content.status}</span></span>
        <div class="card-row"><input type="checkbox" ${b.content.done?'checked':''}>
          <div style="flex:1">
            <div class="card-title" contenteditable="true">${b.content.title}</div>
            <div class="card-desc" contenteditable="true">${b.content.desc}</div>
            <input type="date" value="${b.content.due||''}">
          </div>
        </div></div>`;
    } else if(b.type==='image'){
      body = b.content.src ? `<div class="img-body"><img src="${b.content.src}"></div>`
        : `<div class="img-body"><div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="M20 15l-4.7-4.7a1.6 1.6 0 0 0-2.3 0L4 19"/></svg><span>Нажмите, чтобы добавить фото</span></div><input type="file" accept="image/*" style="display:none"></div>`;
    } else if(b.type==='video'){
      body = b.content.src ? `<div class="img-body"><video src="${b.content.src}" controls></video></div>`
        : `<div class="img-body"><div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="14" height="14" rx="2.5"/><path d="M17 9.5l4-2.3v9.6l-4-2.3"/></svg><span>Нажмите, чтобы добавить видео</span></div><input type="file" accept="video/*" style="display:none"></div>`;
    } else if(b.type==='file'){
      body = b.content.name ? `<div class="file-body"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4"/></svg><div><div class="file-name">${b.content.name}</div><div class="file-size">${b.content.size||''}</div></div></div>`
        : `<div class="file-body img-placeholder" style="padding:14px 40px 14px 36px;justify-content:flex-start;flex-direction:row"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4"/></svg><span>Добавить файл</span><input type="file" style="display:none"></div>`;
    }
    el.innerHTML=`<div class="port-dot" style="background:${typeColor[b.type]||'var(--accent)'};color:${typeColor[b.type]||'var(--accent)'}"></div>
      <div class="block-handle"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg></div>
      <button class="block-close">✕</button>${body}
      <div class="resize-handle"><svg viewBox="0 0 16 16" stroke-width="1.6"><path d="M14 2v12H2M6 14h8M10 14V6"/></svg></div>
      ${b.comments&&b.comments.length?`<div class="comment-badge"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-4 4v-4H4z"/></svg><span>${b.comments.length}</span></div>`:''}
      ${b.pinned?`<div class="pin-badge"><svg viewBox="0 0 24 24"><path d="M12 2l1.5 5.5L19 9l-4 3 1 6-4-3-4 3 1-6-4-3 5.5-1.5z"/></svg></div>`:''}`;
    world.appendChild(el); b.el=el;

    if(b.type==='image'||b.type==='video'){
      const ph=el.querySelector('.img-placeholder'), input=el.querySelector('input[type=file]');
      if(ph){ ph.addEventListener('pointerdown', e=>e.stopPropagation()); ph.addEventListener('click', e=>{e.stopPropagation(); input.click();});
        input.addEventListener('change', ()=>{ const f=input.files[0]; if(!f) return; const r=new FileReader();
          r.onload=()=>{ b.content.src=r.result;
            el.querySelector('.img-body').innerHTML = b.type==='video' ? `<video src="${b.content.src}" controls></video>` : `<img src="${b.content.src}">`;

      minimap.appendChild(d);
    });
    const r=viewport.getBoundingClientRect();
    const vx=(-pan.x)/zoom, vy=(-pan.y)/zoom, vw=r.width/zoom, vh=r.height/zoom;
    const view=document.createElement('div'); view.className='mm-view';
    view.style.left=((vx-bd.minX)*sc)+'px'; view.style.top=((vy-bd.minY)*sc)+'px';
    view.style.width=(vw*sc)+'px'; view.style.height=(vh*sc)+'px';
    minimap.appendChild(view);
    minimap._bounds={bd,sc};
  }
  let mmRAF=null, mmDirty=false;
  function scheduleMinimap(){
    mmDirty=true;
    if(mmRAF) return;
    mmRAF=requestAnimationFrame(()=>{ mmRAF=null; if(mmDirty){ mmDirty=false; updateMinimap(); } });
  }
  minimap.addEventListener('click', (e)=>{
    if(!minimap._bounds) return; const {bd,sc}=minimap._bounds; const rect=minimap.getBoundingClientRect();
    const wx=bd.minX+(e.clientX-rect.left)/sc, wy=bd.minY+(e.clientY-rect.top)/sc;
    const r=viewport.getBoundingClientRect(); pan.x=r.width/2-wx*zoom; pan.y=r.height/2-wy*zoom; applyTransform();
  });

  // ---------------- smart panel ----------------
  const smartPanel=document.getElementById('smart-panel'), smartResult=document.getElementById('smartResult');
  document.getElementById('smart-btn').addEventListener('click', ()=> smartPanel.classList.toggle('open'));
  document.getElementById('smartClose').addEventListener('click', ()=> smartPanel.classList.remove('open'));
  document.querySelectorAll('.smart-actions button').forEach(btn=> btn.addEventListener('click', ()=> runSmart(btn.dataset.act)));

  function runSmart(act){
    const bl=state.blocks;
    if(act==='summary'){
      const t=bl.filter(b=>b.type==='text').length, i=bl.filter(b=>b.type==='image').length, c=bl.filter(b=>b.type==='card').length,
            v=bl.filter(b=>b.type==='video').length, f=bl.filter(b=>b.type==='file').length;
      if(!bl.length){ smartResult.textContent='Полотно пустое — добавьте первый блок.'; return; }
      const parts=[]; if(c) parts.push(`${c} карточ${c===1?'ка':'ки'}`); if(i) parts.push(`${i} изображени${i===1?'е':'я'}`);
      if(t) parts.push(`${t} текстов${t===1?'ая заметка':'ые заметки'}`); if(v) parts.push(`${v} видео`); if(f) parts.push(`${f} файл${f===1?'':'а'}`);
      let s='На полотне: '+parts.join(', ')+'. Связей: '+state.links.length+', областей: '+state.areas.length+'.';
      smartResult.textContent=s; return;
    }
    if(act==='structure'){
      if(!bl.length){ smartResult.textContent='Пока нечего структурировать.'; return; }
      let lines=state.areas.map(a=>`«${a.label}»: ${bl.filter(b=>b.areaId===a.id).length} блок(ов)`);
      const loose=bl.filter(b=>!b.areaId).length; if(loose) lines.push(`Без области: ${loose}`);
      lines.push(`Связей между блоками: ${state.links.length}`);
      smartResult.textContent=lines.join('\n'); return;
    }
    if(act==='similar'){
      const imgs=bl.filter(b=>b.type==='image'&&b.content.src);
      if(imgs.length<2){ smartResult.textContent='Недостаточно изображений для сравнения.'; return; }
      let pairs=0;
      for(let i=0;i<imgs.length;i++) for(let j=i+1;j<imgs.length;j++) if(Math.abs(imgs[i].content.src.length-imgs[j].content.src.length)<400) pairs++;
      smartResult.textContent = pairs ? `Найдено ${pairs} пар визуально похожих изображений (по объёму данных).` : 'Явных похожих изображений не найдено.';
      return;
    }
    if(act==='organize'){
      if(!bl.length){ smartResult.textContent='Полотно пустое.'; return; }
      const c=screenCenterToWorld(); const cols=Math.ceil(Math.sqrt(bl.length));
      bl.forEach((b,idx)=>{ const col=idx%cols, row=Math.floor(idx/cols);
        b.x=c.x-((cols-1)*130)/2+col*130; b.y=c.y-200+row*130; b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px'; b.areaId=null; });
      state.areas.forEach(a=>updateAreaBoundsFromMembers(a));
      drawLinks(); snapshot(); smartResult.textContent=`Разложено ${bl.length} блок(ов) сеткой.`; return;
    }
    if(act==='categorize'){
      const types=[['text','Тексты'],['image','Изображения'],['video','Видео'],['card','Карточки'],['file','Файлы']];
      const present=types.filter(([t])=>bl.some(b=>b.type===t));
      if(present.length<2){ smartResult.textContent='Нужно хотя бы два разных типа блоков.'; return; }
      const c=screenCenterToWorld(); const startX=c.x-(present.length*260)/2;
      present.forEach(([t,label],i)=>{
        const items=bl.filter(b=>b.type===t);
        const a={id:'a'+(idSeq++), x:startX+i*260, y:c.y-220, w:220, h:Math.max(200, items.length*130+60), label};
        state.areas.push(a); buildAreaEl(a); world.insertBefore(a.el, world.children[2]||null);
        items.forEach((b,j)=>{ b.x=a.x+15; b.y=a.y+50+j*130; b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px'; b.areaId=a.id; });
        updateAreaBoundsFromMembers(a);
      });
      drawLinks(); snapshot(); smartResult.textContent=`Создано ${present.length} категори(й) по типу блока.`; return;
    }
    if(act==='tasks'){
      const texts=bl.filter(b=>b.type==='text' && (b.content.text||'').trim());
      if(!texts.length){ smartResult.textContent='Нет текстовых заметок для превращения в задачи.'; return; }
      texts.forEach(tb=>{
        const card={id:'b'+(idSeq++), type:'card', x:tb.x, y:tb.y, w:230, h:128, areaId:tb.areaId, style:{}, comments:[],
          content:{title:(tb.content.text||'').replace(/<[^>]+>/g,'').slice(0,40)||'Задача', desc:'Из заметки на полотне', status:'Открыто', done:false, due:''}};
        state.blocks.push(card); removeBlock(tb);
      });
      state.blocks.forEach(b=>{ if(!b.el || !b.el.isConnected) buildBlockEl(b); });
      drawLinks(); snapshot(); smartResult.textContent=`Создано ${texts.length} задач(и) из заметок.`; return;
    }
    if(act==='findlinks'){
      const candidates=bl.filter(b=>b.type==='text'||b.type==='card');
      function words(b){ const s=b.type==='card'?(b.content.title+' '+b.content.desc):(b.content.text||'').replace(/<[^>]+>/g,''); return new Set(s.toLowerCase().match(/[а-яa-z]{4,}/g)||[]); }
      let added=0;
      outer:
      for(let i=0;i<candidates.length;i++) for(let j=i+1;j<candidates.length;j++){
        if(added>=6) break outer;
        const a=candidates[i], c=candidates[j];
        if(state.links.some(l=>(l.from===a.id&&l.to===c.id)||(l.from===c.id&&l.to===a.id))) continue;
        const wa=words(a), wc=words(c); let shared=false; wa.forEach(w=>{ if(wc.has(w)) shared=true; });
        if(shared){ state.links.push({id:'l'+(idSeq++), from:a.id, to:c.id}); added++; }
      }
      drawLinks(); if(added) snapshot();
      smartResult.textContent = added ? `Добавлено ${added} новых связ(ей) по смыслу.` : 'Явных смысловых пересечений не найдено.';
      return;
    }
    if(act==='random'){
      if(!bl.length){ smartResult.textContent='Полотно пустое.'; return; }
      const pick=bl[Math.floor(Math.random()*bl.length)];
      const r=viewport.getBoundingClientRect(); zoom=1.15; pan.x=r.width/2-(pick.x+pick.w/2)*zoom; pan.y=r.height/2-(pick.y+pick.h/2)*zoom; applyTransform();
      clearSelection(); selected.add(pick); pick.el.classList.add('selected'); updateStyleBarPos();
      const label=blockText(pick).slice(0,40) || (pick.type==='image'?'изображение':pick.type==='video'?'видео':pick.type);
      smartResult.textContent = `Попробуйте развить: «${label||'этот блок'}»`;
      return;
    }
  }

  // ---------------- mode dropdown & presentation ----------------
  const modeBtn=document.getElementById('modeBtn'), modeMenu=document.getElementById('modeMenu'), modeLabel=document.getElementById('modeLabel');
  modeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); modeMenu.classList.toggle('open'); });
  document.addEventListener('click', ()=> modeMenu.classList.remove('open'));
  modeMenu.querySelectorAll('.mode-item').forEach(item=> item.addEventListener('click', (e)=>{
    e.stopPropagation(); modeMenu.querySelectorAll('.mode-item').forEach(i=>i.classList.remove('active')); item.classList.add('active');
    modeLabel.textContent=item.textContent; modeMenu.classList.remove('open'); onModeChange(item.dataset.value);
  }));
  let presentIndex=0;
  function resetToPersonal(){ modeLabel.textContent='Личное'; modeMenu.querySelectorAll('.mode-item').forEach(i=>i.classList.toggle('active', i.dataset.value==='personal')); }
  function onModeChange(mode){
    if(mode==='present'){
      if(!state.blocks.length){ flashHint('Добавьте хотя бы один блок для презентации'); resetToPersonal(); return; }
      document.body.classList.add('presenting'); presentIndex=0; goToPresentBlock();
    } else document.body.classList.remove('presenting');
  }
  function goToPresentBlock(){
    const b=state.blocks[presentIndex]; if(!b) return; const r=viewport.getBoundingClientRect();
    zoom=1.1; pan.x=r.width/2-(b.x+b.w/2)*zoom; pan.y=r.height/2-(b.y+b.h/2)*zoom; applyTransform();
    document.getElementById('presentCount').textContent=(presentIndex+1)+' / '+state.blocks.length;
  }
  document.getElementById('presentNext').onclick=()=>{ presentIndex=(presentIndex+1)%state.blocks.length; goToPresentBlock(); };
  document.getElementById('presentPrev').onclick=()=>{ presentIndex=(presentIndex-1+state.blocks.length)%state.blocks.length; goToPresentBlock(); };
  document.getElementById('presentExit').onclick=()=>{ document.body.classList.remove('presenting'); resetToPersonal(); };
  window.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&document.body.classList.contains('presenting')) document.getElementById('presentExit').click(); });

  // Reuse the profile avatar stored by the main Lumae app.
  const profileAvatarUrls=new Map();
  function profileAvatarSource(ref){
    if(!ref||!ref.startsWith('lumae-media:')) return Promise.resolve(ref||'');
    if(profileAvatarUrls.has(ref)) return Promise.resolve(profileAvatarUrls.get(ref));
    return new Promise(resolve=>{
      const request=indexedDB.open('lumae.media.v1',1);
      request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('media'))request.result.createObjectStore('media',{keyPath:'id'});};
      request.onerror=()=>resolve('');
      request.onsuccess=()=>{
        const db=request.result, read=db.transaction('media','readonly').objectStore('media').get(ref.slice('lumae-media:'.length));
        read.onsuccess=()=>{const url=read.result?.blob?URL.createObjectURL(read.result.blob):'';if(url)profileAvatarUrls.set(ref,url);resolve(url);db.close();};
        read.onerror=()=>{resolve('');db.close();};
      };
    });
  }
  async function renderSharedProfileAvatar(){
    let profile=null;
    try{profile=JSON.parse(localStorage.getItem('lumae.users.v8.profiles')||'[]')[0]||null;}catch{}
    const name=profile?.name||'Lumae', source=profile?.avaVidSrc||profile?.avaImgSrc||'';
    const media=await profileAvatarSource(source);
    document.querySelectorAll('[data-profile-avatar]').forEach(button=>{
      button.setAttribute('aria-label',profile?`Профиль ${name}`:'Профиль');
      button.title=name;
      if(media){const element=document.createElement(profile?.avaVidSrc?'video':'img');element.src=media;element.alt=profile?.avaVidSrc?'':'Аватар профиля';if(element.tagName==='VIDEO'){element.muted=true;element.autoplay=true;element.loop=true;element.playsInline=true;}button.replaceChildren(element);}
      else button.textContent=(name||'L').trim().charAt(0).toUpperCase()||'L';
    });
  }
  renderSharedProfileAvatar();
  window.addEventListener('storage',event=>{if(event.key==='lumae.users.v8.profiles')renderSharedProfileAvatar();});

  // ---------------- init ----------------
  applyTransform();
  updateHist();
})();
</script>
